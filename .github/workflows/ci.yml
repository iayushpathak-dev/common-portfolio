# CI: runs only for the `production` branch.
#  - pull_request: checks a PR into production before you merge it
#  - push: runs again after the merge lands on production
# Day-to-day work on main (or any other branch) does not trigger it.
# Vercel deploys production separately (see vercel.json).
name: CI

on:
  push:
    branches: [production]
  pull_request:
    branches: [production]

# A newer push to the same branch cancels the older, still-running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
